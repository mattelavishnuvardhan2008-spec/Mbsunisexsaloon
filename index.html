<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBS - Premium Grooming</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <!-- Added Poppins 900 for the logo style -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;700&family=Poppins:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #F9F6F0;
            --surface: #FFFFFF;
            --beige: #E2D3B3;
            --text: #3F3423;
            --muted: #7E6A52;
            --accent: #CDAA4F;
            --accent-dark: #A2843D;
            --border: rgba(184, 151, 84, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* NAVIGATION */
        nav {
            position: fixed; top: 0; width: 100%; padding: 16px 32px;
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface); border-bottom: 2px solid var(--accent); z-index: 1000;
        }
        
        /* UPDATED: Thick font for the MBS Logo */
        .logo { 
            font-family: 'Poppins', sans-serif;
            font-weight: 900;
            font-size: 32px;
            color: var(--accent-dark);
            letter-spacing: -2px; /* Brings letters close together */
        }
        
        .nav-links a { color: var(--text); text-decoration: none; font-weight: 700; border: 1px solid var(--accent); padding: 8px 16px; border-radius: 4px; font-size: 14px; transition: 0.3s; }
        .nav-links a:hover { background: var(--accent); color: white; }

        /* HERO */
        .hero {
            width: 100%; min-height: 90vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; background: radial-gradient(circle at top center, #FEF6E4 0%, #E9D5A2 40%, #D3BE90 100%); padding: 100px 20px 40px;
        }
        
        /* UPDATED: Thick font for the MBS Hero Text */
        .hero h1 { 
            font-family: 'Poppins', sans-serif;
            font-weight: 900;
            font-size: clamp(80px, 15vw, 140px); 
            line-height: 0.9; 
            color: var(--accent-dark); 
            letter-spacing: -5px; /* Tightens letters for that logo look */
            margin-bottom: 10px; 
        }
        
        .hero .tagline { font-size: clamp(16px, 3vw, 20px); letter-spacing: 6px; text-transform: uppercase; color: var(--text); margin-bottom: 30px; font-weight: 400; }
        .hero p { max-width: 500px; margin: 0 auto 40px; font-size: 16px; line-height: 1.6; }
        .btn-primary { padding: 16px 32px; background: var(--accent-dark); color: white; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn-primary:hover { background: var(--accent); }

        /* SECTIONS */
        .content-section { padding: 80px 20px; }
        .section-header { text-align: center; margin-bottom: 40px; }
        .section-subtitle { font-size: 12px; letter-spacing: 4px; text-transform: uppercase; color: var(--accent-dark); margin-bottom: 10px; font-weight: 700; }
        .section-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(36px, 5vw, 48px); color: var(--text); letter-spacing: 2px; }

        /* WHY MBS */
        .why-mbs { background: var(--beige); }
        .why-grid { display: grid; grid-template-columns: 1fr; gap: 30px; max-width: 1000px; margin: 0 auto; }
        @media (min-width: 768px) { .why-grid { grid-template-columns: repeat(3, 1fr); } }
        .why-item h3 { font-size: 20px; margin-bottom: 10px; color: var(--text); }
        .why-item p { color: var(--text); line-height: 1.6; font-size: 15px; opacity: 0.8; }

        /* HOW IT WORKS */
        .how-it-works { background: var(--bg); }
        .steps-grid { display: grid; grid-template-columns: 1fr; gap: 40px; max-width: 1000px; margin: 0 auto; }
        @media (min-width: 768px) { .steps-grid { grid-template-columns: repeat(3, 1fr); } }
        .step-num { font-family: 'Bebas Neue', sans-serif; font-size: 60px; color: var(--accent-dark); line-height: 1; margin-bottom: 10px; }
        .step-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
        .step-desc { font-size: 15px; color: var(--text); opacity: 0.8; line-height: 1.6; }

        /* SERVICES */
        .services-section { padding: 80px 20px; background: var(--beige); max-width: 900px; margin: 0 auto; }
        .filter-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .filter-btn { padding: 10px 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; font-weight: 700; color: var(--text); cursor: pointer; transition: 0.2s; }
        .filter-btn.active { background: var(--accent-dark); color: white; border-color: var(--accent-dark); }
        .category-group { margin-bottom: 30px; }
        .category-title { font-size: 20px; font-weight: 700; margin-bottom: 15px; border-bottom: 2px solid var(--border); padding-bottom: 5px; color: var(--accent-dark); }
        .service-item { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border); }
        .service-info h4 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .service-info p { font-size: 13px; color: var(--muted); }
        .service-meta { text-align: right; }
        .service-price { font-size: 16px; font-weight: 700; color: var(--accent-dark); }
        .service-time { font-size: 12px; color: var(--muted); }

        /* BOOKING */
        .booking-section { padding: 60px 20px; background: var(--bg); display: flex; justify-content: center; }
        .appointment-panel { background: var(--surface); border: 2px solid var(--accent); padding: 40px; width: 100%; max-width: 700px; border-radius: 12px; }
        .appointment-form { display: flex; flex-direction: column; gap: 20px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--text); }
        .form-group input, .form-group select { width: 100%; padding: 14px; border: 1px solid var(--border); font-family: inherit; font-size: 15px; background: var(--bg); color: var(--text); border-radius: 4px; }
        .service-selection-container { border: 1px solid var(--border); padding: 15px; border-radius: 4px; background: var(--bg); max-height: 250px; overflow-y: auto; }
        .selection-category { margin-bottom: 15px; }
        .selection-category h5 { font-size: 14px; color: var(--accent-dark); margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
        .checkbox-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 14px; cursor: pointer; }
        .checkbox-row input { accent-color: var(--accent-dark); width: 16px; height: 16px; cursor: pointer; }
        .total-summary { background: var(--beige); padding: 15px; border-radius: 4px; font-weight: 700; text-align: right; font-size: 18px; margin-top: 10px; border: 1px solid var(--accent); }
        .time-row { display: grid; grid-template-columns: 1fr 90px; gap: 10px; }
        .book-btn { padding: 18px; border: none; background: var(--accent-dark); color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; border-radius: 4px; width: 100%; margin-top: 10px; }
        .book-btn:hover { background: var(--accent); }

        /* FOOTER */
        footer { background: var(--surface); color: var(--text); padding: 40px 20px; text-align: center; border-top: 2px solid var(--accent); }
        
        .footer-logo { 
            font-family: 'Poppins', sans-serif; 
            font-weight: 900; 
            font-size: 40px; 
            color: var(--accent-dark); 
            letter-spacing: -2px; 
            margin-bottom: 10px;
        }
        
        .legal-links { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
        .legal-links a { color: var(--muted); font-size: 13px; text-decoration: none; font-weight: 600; }
        .legal-links a:hover { color: var(--accent-dark); }

        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(63, 52, 35, 0.7); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--surface); padding: 40px; text-align: center; max-width: 450px; width: 90%; border-top: 5px solid var(--accent-dark); border-radius: 8px; }
        .modal-content h3 { color: var(--accent-dark); font-family: 'Bebas Neue', sans-serif; font-size: 32px; margin-bottom: 15px; }
        .modal-close-btn { padding: 12px 30px; background: var(--text); color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 20px; }
    </style>
</head>
