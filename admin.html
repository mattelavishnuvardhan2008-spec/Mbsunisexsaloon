<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBS Admin Panel</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #111111; color: white; margin: 0; padding: 0; }
    header { background: #000; padding: 20px; border-bottom: 2px solid #C6A664; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
    @media (min-width: 768px) { header { flex-direction: row; justify-content: space-between; align-items: center; } }
    header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 4px; color: #C6A664; margin: 0; }
    
    .admin-key-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; width: 100%; }
    @media (min-width: 768px) { .admin-key-row { width: auto; } }
    .admin-key-row input { padding: 10px 14px; border-radius: 6px; border: 1px solid #333; background: #222; color: white; flex: 1; min-width: 200px; }
    .admin-key-row button { padding: 10px 18px; border: none; background: #C6A664; color: #111; font-weight: bold; border-radius: 6px; cursor: pointer; }
    
    main { padding: 20px; max-width: 1200px; margin: 0 auto; }
    
    .actions-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .action-btn { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; font-size: 14px; }
    .btn-download { background: #2E7D32; }
    .btn-delete { background: #C62828; }
    
    .appointments-table { width: 100%; border-collapse: collapse; background: #1A1A1A; border-radius: 8px; overflow: hidden; display: block; overflow-x: auto; }
    .appointments-table th, .appointments-table td { padding: 14px; border-bottom: 1px solid #333; text-align: left; font-size: 14px; white-space: nowrap; }
    .appointments-table th { background: #222; color: #C6A664; font-weight: bold; }
    
    .alert { margin-bottom: 20px; padding: 16px; border-radius: 8px; background: rgba(198, 166, 100, 0.1); border: 1px solid #C6A664; color: #C6A664; }
  </style>
</head>
<body>
  <header>
    <h1>MBS Admin</h1>
    <div class="admin-key-row">
      <input id="adminKey" type="password" placeholder="Enter admin key" />
      <button onclick="loadAppointments()">Load</button>
    </div>
  </header>
  <main>
    <div class="alert" id="adminAlert">Enter admin key to load appointment details.</div>
    
    <div class="actions-bar">
      <button class="action-btn btn-download" onclick="downloadCSV()">Download Excel (CSV)</button>
      <button class="action-btn btn-delete" onclick="deleteAppointments()">Delete All</button>
    </div>

    <table class="appointments-table" id="appointmentsTable">
      <thead>
        <tr>
          <th>Chair</th>
          <th>Name</th>
          <th>Phone</th>
          <th>Service</th>
          <th>Date</th>
          <th>Time</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <script>
    let currentAppointments = [];

    async function loadAppointments() {
      const key = document.getElementById('adminKey').value.trim();
      const alertBox = document.getElementById('adminAlert');
      const tbody = document.querySelector('#appointmentsTable tbody');
      tbody.innerHTML = '';
      currentAppointments = [];

      if (!key) { alertBox.textContent = 'Owner key is required.'; return; }
      alertBox.textContent = 'Loading...';

      try {
        const response = await fetch('/api/admin/appointments', {
          headers: { authorization: `Bearer ${key}` }
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);

        if (!data.appointments.length) { alertBox.textContent = 'No appointments found.'; return; }
        
        currentAppointments = data.appointments;
        alertBox.textContent = `Loaded ${data.appointments.length} appointment(s).`;
        
        data.appointments.forEach((app) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><strong>Chair ${app.chair || '?'}</strong></td>
            <td>${app.name}</td>
            <td>${app.phone}</td>
            <td>${app.service}</td>
            <td>${app.date}</td>
            <td>${app.time}</td>
            <td>${app.notes || '—'}</td>
          `;
          tbody.appendChild(row);
        });
      } catch (error) {
        alertBox.textContent = `Error: ${error.message}`;
      }
    }

    function downloadCSV() {
        if (!currentAppointments.length) return alert("No appointments to download.");
        const headers = ['Chair', 'Name', 'Phone', 'Service', 'Date', 'Time', 'Notes'];
        const rows = currentAppointments.map(app => [
            app.chair || '?', app.name, app.phone, app.service, app.date, app.time, app.notes || ''
        ].map(val => `"${val.toString().replace(/"/g, '""')}"`).join(','));
        
        const blob = new Blob([headers.join(',') + '\n' + rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `MBS_Appointments_${new Date().toISOString().split('T')[0]}.csv`;
        link.click();
    }

    async function deleteAppointments() {
        const key = document.getElementById('adminKey').value.trim();
        if (!key) return alert("Enter admin key first.");
        if (!confirm("Delete ALL appointments? This cannot be undone.")) return;

        try {
            const response = await fetch('/api/admin/appointments', {
                method: 'DELETE', headers: { authorization: `Bearer ${key}` }
            });
            if (!response.ok) throw new Error('Failed to delete');
            document.querySelector('#appointmentsTable tbody').innerHTML = '';
            document.getElementById('adminAlert').textContent = 'All appointments cleared.';
            currentAppointments = [];
        } catch (error) { alert("Error: " + error.message); }
    }
  </script>
</body>
</html>
